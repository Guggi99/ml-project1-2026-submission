<svg xmlns="http://www.w3.org/2000/svg" width="680" height="700" viewBox="0 0 680 700" role="img"><title>The 11 steps of a complete run</title><desc>Step 1 commit the code. Phase A, every experiment: 2 write the config, 3 run 5-fold CV, 4 log the run, 5 compare with the baseline, 6 rebuild SUMMARY.md, looping back to step 2. Step 7 the Thursday decision picks a run. Phase B, chosen run only: 8 make the CSV with run.py, 9 log the submission, 10 upload to AIcrowd. Step 11 clear outputs and commit. Gray boxes are done by hand.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.t{font-size:14px;fill:#2C2C2A}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}
</style><rect width="680" height="700" fill="#ffffff"/>
<g class="c-gray"><rect x="180" y="20" width="320" height="64" rx="4" stroke-width="0.5"/><text class="th" x="340" y="40" text-anchor="middle">1. Commit your code</text><text class="ts" x="340" y="58" text-anchor="middle">by hand, git</text><text class="ts" x="340" y="75" text-anchor="middle">else the run is dirty and never counts</text></g>
<rect x="10" y="110" width="325" height="475" rx="8" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="th" x="26" y="133">Phase A: every experiment</text><text class="ts" x="26" y="151">is this recipe better?</text>
<rect x="345" y="110" width="325" height="475" rx="8" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="th" x="361" y="133">Phase B: chosen run only</text><text class="ts" x="361" y="151">the AIcrowd file</text>
<line class="arr" x1="300" y1="84" x2="300" y2="163" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="20" y="165" width="305" height="64" rx="4" stroke-width="0.5"/><text class="th" x="172" y="185" text-anchor="middle">2. Write the config</text><text class="ts" x="172" y="203" text-anchor="middle">experiments/&lt;your notebook&gt;.ipynb</text><text class="ts" x="172" y="220" text-anchor="middle">CONFIG, NAME, HYPOTHESIS, BASELINE</text></g>
<g class="c-purple"><rect x="20" y="249" width="305" height="64" rx="4" stroke-width="0.5"/><text class="th" x="172" y="269" text-anchor="middle">3. Run 5-fold CV</text><text class="ts" x="172" y="287" text-anchor="middle">src/pipeline.py, src/validation.py</text><text class="ts" x="172" y="304" text-anchor="middle">develop, cross_validate, f1_score</text></g>
<g class="c-purple"><rect x="20" y="333" width="305" height="64" rx="4" stroke-width="0.5"/><text class="th" x="172" y="353" text-anchor="middle">4. Log the run</text><text class="ts" x="172" y="371" text-anchor="middle">src/pipeline.py, src/runs.py</text><text class="ts" x="172" y="388" text-anchor="middle">run_experiment, log_run, git_state</text></g>
<g class="c-purple"><rect x="20" y="417" width="305" height="64" rx="4" stroke-width="0.5"/><text class="th" x="172" y="437" text-anchor="middle">5. Compare with the baseline</text><text class="ts" x="172" y="455" text-anchor="middle">src/runs.py</text><text class="ts" x="172" y="472" text-anchor="middle">load_run, fold-by-fold F1 delta</text></g>
<g class="c-purple"><rect x="20" y="501" width="305" height="64" rx="4" stroke-width="0.5"/><text class="th" x="172" y="521" text-anchor="middle">6. Rebuild SUMMARY.md</text><text class="ts" x="172" y="539" text-anchor="middle">tools/make_summary.py, src/runs.py</text><text class="ts" x="172" y="556" text-anchor="middle">load_runs, summary_markdown</text></g>
<line class="arr" x1="172" y1="229" x2="172" y2="247" marker-end="url(#arrow)"/>
<line class="arr" x1="172" y1="313" x2="172" y2="331" marker-end="url(#arrow)"/>
<line class="arr" x1="172" y1="397" x2="172" y2="415" marker-end="url(#arrow)"/>
<line class="arr" x1="172" y1="481" x2="172" y2="499" marker-end="url(#arrow)"/>
<path class="arr" d="M20 533 L14 533 L14 197 L18 197" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<path class="arr" d="M325 533 L340 533 L340 197 L353 197" fill="none" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="355" y="165" width="305" height="64" rx="4" stroke-width="0.5"/><text class="th" x="507" y="185" text-anchor="middle">7. Thursday decision</text><text class="ts" x="507" y="203" text-anchor="middle">by hand, the team reads SUMMARY.md</text><text class="ts" x="507" y="220" text-anchor="middle">fill in decision, pick the run id</text></g>
<g class="c-teal"><rect x="355" y="249" width="305" height="64" rx="4" stroke-width="0.5"/><text class="th" x="507" y="269" text-anchor="middle">8. Make the CSV</text><text class="ts" x="507" y="287" text-anchor="middle">run.py --run &lt;id&gt;, src/pipeline.py</text><text class="ts" x="507" y="304" text-anchor="middle">load_run, submission_config, produce</text></g>
<g class="c-teal"><rect x="355" y="333" width="305" height="64" rx="4" stroke-width="0.5"/><text class="th" x="507" y="353" text-anchor="middle">9. Log the submission</text><text class="ts" x="507" y="371" text-anchor="middle">run.py --log, src/runs.py</text><text class="ts" x="507" y="388" text-anchor="middle">log_submission, sha256_of</text></g>
<g class="c-gray"><rect x="355" y="417" width="305" height="64" rx="4" stroke-width="0.5"/><text class="th" x="507" y="437" text-anchor="middle">10. Upload to AIcrowd</text><text class="ts" x="507" y="455" text-anchor="middle">by hand</text><text class="ts" x="507" y="472" text-anchor="middle">type in aicrowd_f1, then redo step 6</text></g>
<line class="arr" x1="507" y1="229" x2="507" y2="247" marker-end="url(#arrow)"/>
<line class="arr" x1="507" y1="313" x2="507" y2="331" marker-end="url(#arrow)"/>
<line class="arr" x1="507" y1="397" x2="507" y2="415" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="180" y="610" width="320" height="64" rx="4" stroke-width="0.5"/><text class="th" x="340" y="630" text-anchor="middle">11. Clear outputs, commit</text><text class="ts" x="340" y="648" text-anchor="middle">by hand, git</text><text class="ts" x="340" y="665" text-anchor="middle">run JSON, SUMMARY.md, submission JSON</text></g>
<path class="arr" d="M172 565 L172 596 L230 596 L230 608" fill="none" marker-end="url(#arrow)"/>
<path class="arr" d="M507 481 L507 596 L450 596 L450 608" fill="none" marker-end="url(#arrow)"/>
</svg>
