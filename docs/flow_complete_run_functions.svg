<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1020" viewBox="0 0 680 1020" role="img"><title>Complete run of the ml-project1-2026 pipeline, with files and functions</title><desc>Each step names the step, the file it lives in and the functions it calls. Phase A develops and logs a cross-validated score; Phase B, via run.py, reads a logged run's config, fits on all rows, predicts the test set, checks and writes the submission CSV. A bottom panel shows the steps inside fit_fn and predict_fn.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.t{font-size:14px;fill:#2C2C2A}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}
</style><rect width="680" height="1020" fill="#ffffff"/>
<g class="c-gray"><rect x="20" y="30" width="200" height="72" rx="4" stroke-width="0.5"/><text class="th" x="120" y="50" text-anchor="middle">Config dict</text><text class="ts" x="120" y="68" text-anchor="middle">experiments/*.ipynb</text><text class="ts" x="120" y="85" text-anchor="middle">or src/pipeline.BASELINE</text></g>
<g class="c-gray"><rect x="240" y="30" width="200" height="72" rx="4" stroke-width="0.5"/><text class="th" x="340" y="50" text-anchor="middle">Load and cache</text><text class="ts" x="340" y="68" text-anchor="middle">src/pipeline.py, helpers.py</text><text class="ts" x="340" y="85" text-anchor="middle">load_data, load_csv_data</text></g>
<g class="c-gray"><rect x="460" y="30" width="200" height="72" rx="4" stroke-width="0.5"/><text class="th" x="560" y="50" text-anchor="middle">Raw CSVs</text><text class="ts" x="560" y="68" text-anchor="middle">data/</text><text class="ts" x="560" y="85" text-anchor="middle">x_train, y_train, x_test</text></g>
