<g class="c-teal"><rect x="355" y="264" width="305" height="64" rx="4" stroke-width="0.5"/><text class="th" x="507" y="284" text-anchor="middle">Fit on all training rows</text><text class="ts" x="507" y="302" text-anchor="middle">src/pipeline.py</text><text class="ts" x="507" y="319" text-anchor="middle">produce, make_pipeline, fit_fn</text></g>
<g class="c-teal"><rect x="355" y="348" width="305" height="64" rx="4" stroke-width="0.5"/><text class="th" x="507" y="368" text-anchor="middle">Predict the test rows</text><text class="ts" x="507" y="386" text-anchor="middle">src/pipeline.py, src/preprocessing.py</text><text class="ts" x="507" y="403" text-anchor="middle">predict_fn, transform, tx @ w</text></g>
<g class="c-teal"><rect x="355" y="432" width="305" height="64" rx="4" stroke-width="0.5"/><text class="th" x="507" y="452" text-anchor="middle">Sanity checks</text><text class="ts" x="507" y="470" text-anchor="middle">src/pipeline.py</text><text class="ts" x="507" y="487" text-anchor="middle">produce: asserts, rate within 2x</text></g>
<g class="c-gray"><rect x="355" y="516" width="305" height="64" rx="4" stroke-width="0.5"/><text class="th" x="507" y="536" text-anchor="middle">Write submission.csv</text><text class="ts" x="507" y="554" text-anchor="middle">src/helpers.py</text><text class="ts" x="507" y="571" text-anchor="middle">create_csv_submission</text></g>
<g class="c-gray"><rect x="355" y="600" width="305" height="64" rx="4" stroke-width="0.5"/><text class="th" x="507" y="620" text-anchor="middle">Record it (only with --log)</text><text class="ts" x="507" y="638" text-anchor="middle">run.py, src/runs.py</text><text class="ts" x="507" y="655" text-anchor="middle">log_submission, sha256_of, git_state</text></g>
