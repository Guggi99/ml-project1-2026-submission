<rect x="345" y="125" width="325" height="640" rx="8" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="th" x="361" y="148">Phase B: run.py</text><text class="ts" x="361" y="166">make the AIcrowd file</text>
