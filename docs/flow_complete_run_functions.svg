<g class="c-purple"><rect x="20" y="180" width="305" height="64" rx="4" stroke-width="0.5"/><text class="th" x="172" y="200" text-anchor="middle">Start a scored run</text><text class="ts" x="172" y="218" text-anchor="middle">src/pipeline.py</text><text class="ts" x="172" y="235" text-anchor="middle">run_experiment, develop, make_pipeline</text></g>
<g class="c-purple"><rect x="20" y="264" width="305" height="64" rx="4" stroke-width="0.5"/><text class="th" x="172" y="284" text-anchor="middle">Split into 5 stratified folds</text><text class="ts" x="172" y="302" text-anchor="middle">src/validation.py</text><text class="ts" x="172" y="319" text-anchor="middle">cross_validate, stratified_k_fold_indices</text></g>
<g class="c-purple"><rect x="20" y="348" width="305" height="64" rx="4" stroke-width="0.5"/><text class="th" x="172" y="368" text-anchor="middle">fit_fn on 80 % train rows</text><text class="ts" x="172" y="386" text-anchor="middle">pipeline, preprocessing, implementations</text><text class="ts" x="172" y="403" text-anchor="middle">fit_preprocessor, fit_model, fit_threshold</text></g>
<g class="c-purple"><rect x="20" y="432" width="305" height="64" rx="4" stroke-width="0.5"/><text class="th" x="172" y="452" text-anchor="middle">predict_fn on 20 % val rows</text><text class="ts" x="172" y="470" text-anchor="middle">src/pipeline.py, src/preprocessing.py</text><text class="ts" x="172" y="487" text-anchor="middle">transform, then tx @ w &gt; cut-off</text></g>
<g class="c-purple"><rect x="20" y="516" width="305" height="64" rx="4" stroke-width="0.5"/><text class="th" x="172" y="536" text-anchor="middle">Score the fold, repeat x5</text><text class="ts" x="172" y="554" text-anchor="middle">src/validation.py</text><text class="ts" x="172" y="571" text-anchor="middle">f1_score, accuracy, then mean +- std</text></g>
<g class="c-gray"><rect x="20" y="600" width="305" height="64" rx="4" stroke-width="0.5"/><text class="th" x="172" y="620" text-anchor="middle">Write the run record</text><text class="ts" x="172" y="638" text-anchor="middle">src/runs.py</text><text class="ts" x="172" y="655" text-anchor="middle">log_run, git_state</text></g>
<g class="c-gray"><rect x="20" y="684" width="305" height="64" rx="4" stroke-width="0.5"/><text class="th" x="172" y="704" text-anchor="middle">Rebuild results/SUMMARY.md</text><text class="ts" x="172" y="722" text-anchor="middle">tools/make_summary.py, src/runs.py</text><text class="ts" x="172" y="739" text-anchor="middle">load_runs, load_submissions, summary_markdown</text></g>
